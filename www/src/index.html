<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Evento Cultural — Descubre eventos en Chile</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="description" content="Descubre eventos culturales, comerciales y municipales en Chile: ferias, festivales, expos y panoramas de Arica a Punta Arenas." />
  <meta name="format-detection" content="telephone=no" />

  <!-- Icono de la app (src/assets/icon/): SVG para navegadores modernos y PNG
       de respaldo. La versión apple-touch-icon va aplanada sobre el papel del
       tema, porque iOS ignora la transparencia. -->
  <link rel="icon" type="image/svg+xml" href="assets/icon/icon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/apple-touch-icon.png" />
  <link rel="manifest" href="assets/manifest.webmanifest" />
  <meta name="theme-color" content="#7a4f2e" />

  <!-- Tipografías del sistema de diseño: Inter (texto) + Fraunces (títulos).
       display=swap evita texto invisible mientras cargan. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&display=swap"
  />

  <!-- add to homescreen for ios: nombre bajo el icono y barra de estado -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Evento Cultural" />
  <meta name="application-name" content="Evento Cultural" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
